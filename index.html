<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar de Actividades CULP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0a0e14;
  --bg-2: #0f1520;
  --surface: #141b26;
  --surface-2: #1a2330;
  --surface-3: #202a3a;
  --border: #253142;
  --border-bright: #384658;
  --text: #e8ecf1;
  --text-dim: #8b9cb3;
  --text-mute: #5a6b82;
  --team-a: #e43d3d;
  --team-a-dim: #7a2020;
  --team-a-bg: rgba(228, 61, 61, 0.14);
  --team-b: #3d8de4;
  --team-b-dim: #204e7a;
  --team-b-bg: rgba(61, 141, 228, 0.14);
  --field: #1d8a4a;
  --field-dark: #0e5b30;
  --accent: #fbbf24;
  --accent-dim: #92700f;
  --success: #22c55e;
  --danger: #ef4444;
  --warn: #f59e0b;
  --display: 'Bebas Neue', sans-serif;
  --body: 'Archivo', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(ellipse at 15% -5%, rgba(228, 61, 61, 0.08), transparent 45%),
    radial-gradient(ellipse at 85% -5%, rgba(61, 141, 228, 0.08), transparent 45%);
  padding-bottom: 96px;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(10, 14, 20, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
}
.header-inner { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; }
.logo {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--accent);
  flex: 1;
  line-height: 1;
}
.logo-accent { color: var(--text); }

.mini-score {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.mini-score .sep { color: var(--text-mute); }
.mini-score .a { color: var(--team-a); }
.mini-score .b { color: var(--team-b); }

.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 34px; height: 34px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.icon-btn:active { transform: scale(0.94); }

/* Team toggle */
.team-toggle {
  max-width: 900px;
  margin: 8px auto 0;
  padding: 0 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.team-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 6px 10px;
  cursor: pointer;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  transition: all 0.15s;
  text-align: left;
  color: var(--text);
}
.team-btn .tb-label { display: none; }
.team-btn .tb-name {
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: 1px;
  line-height: 1;
  margin: 0;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.team-btn .tb-score {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 800;
  margin-left: auto;
}
.team-btn.a .tb-name { color: var(--team-a); }
.team-btn.a .tb-score { color: var(--team-a); }
.team-btn.b .tb-name { color: var(--team-b); }
.team-btn.b .tb-score { color: var(--team-b); }
.team-btn.a.active {
  background: var(--team-a-bg);
  border-color: var(--team-a);
  box-shadow: 0 0 0 3px rgba(228, 61, 61, 0.15);
}
.team-btn.b.active {
  background: var(--team-b-bg);
  border-color: var(--team-b);
  box-shadow: 0 0 0 3px rgba(61, 141, 228, 0.15);
}
.team-btn:active { transform: scale(0.98); }

/* Match meta */
.match-meta {
  max-width: 900px;
  margin: 8px auto 0;
  padding: 0 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.half-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.timer-block {
  display: flex;
  align-items: center;
  gap: 4px;
}
.timer-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text);
  height: 26px;
}
.timer-btn:active { transform: scale(0.96); }
.timer-dot {
  font-size: 9px;
  color: var(--text-mute);
  transition: color 0.2s;
}
.timer-btn.running .timer-dot {
  color: var(--success);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.timer-text {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text);
}
.timer-btn.running .timer-text { color: var(--success); }
.timer-reset {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-mute);
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.timer-reset:hover { color: var(--text); border-color: var(--border-bright); }
.timer-reset:active { transform: scale(0.94); }
.half-toggle button {
  background: transparent;
  border: none;
  color: var(--text-mute);
  padding: 5px 11px;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.15s;
}
.half-toggle button.active {
  background: var(--accent);
  color: #000;
}

/* Section titles */
.section-title {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--text-mute);
  margin: 18px auto 8px;
  padding: 0 14px;
  max-width: 900px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}
.step-num {
  background: var(--accent);
  color: #000;
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0;
}
.step-num.done { background: var(--success); color: #fff; }
.step-num.wait { background: var(--surface-2); color: var(--text-mute); border: 1px solid var(--border); }

/* Field */
.field-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 14px;
}
.field-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  font-weight: 600;
  text-transform: uppercase;
}
.field-dir b { color: var(--accent); font-weight: 700; }

.field {
  position: relative;
  background: linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
  border-radius: 12px;
  padding: 10px;
  border: 2px solid rgba(255,255,255,0.08);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 50%, rgba(0,0,0,0.12) 100%),
    linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
}
.zones {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
}
.zone {
  background: rgba(0,0,0,0.22);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 10px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 82px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.zone::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
  pointer-events: none;
}
.zone.danger { background: rgba(239, 68, 68, 0.22); border-color: rgba(239, 68, 68, 0.35); }
.zone.attack { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.35); }
.zone:active { transform: scale(0.95); }
.zone.selected {
  background: var(--accent);
  border-color: #fff;
  color: #000;
}
.zone.selected::after {
  content: '✓';
  position: absolute;
  top: 3px; right: 5px;
  font-size: 10px;
  font-weight: 900;
  color: rgba(0,0,0,0.6);
}
.zone-num {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 400;
  line-height: 1;
  color: rgba(255,255,255,0.7);
  margin-bottom: 3px;
  letter-spacing: 1px;
}
.zone.selected .zone-num { color: rgba(0,0,0,0.65); }
.zone-label {
  font-size: 10px;
  font-weight: 700;
  line-height: 1.15;
  color: rgba(255,255,255,0.95);
  text-transform: uppercase;
  letter-spacing: 0.2px;
}
.zone.selected .zone-label { color: rgba(0,0,0,0.78); }

/* Selection bar */
.selection-bar {
  max-width: 900px;
  margin: 6px auto 0;
  padding: 0 14px;
}
.selection-inner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  min-height: 26px;
}
.sel-label {
  font-family: var(--display);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-mute);
  flex-shrink: 0;
}
.chip {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  padding: 1px 6px !important;
  border-radius: 3px !important;
  font-family: var(--body);
  font-size: 9.5px !important;
  font-weight: 700;
  letter-spacing: 0.2px;
  border: 1px solid transparent;
  line-height: 1;
  height: 15px !important;
  min-height: 15px !important;
  max-height: 15px !important;
  white-space: nowrap;
  box-sizing: border-box;
}
.chip.team-a { background: var(--team-a-bg); color: var(--team-a); border-color: var(--team-a-dim); }
.chip.team-b { background: var(--team-b-bg); color: var(--team-b); border-color: var(--team-b-dim); }
.chip.field-zone { background: rgba(251, 191, 36, 0.14); color: var(--accent); border-color: var(--accent-dim); }
.chip.empty { background: var(--surface-2); color: var(--text-mute); border-color: var(--border); }
/* Pill is alias of chip — used in popups */
.pill { display: inline-flex; align-items: center; justify-content: center; padding: 1px 6px; border-radius: 3px; font-family: var(--body); font-size: 9.5px; font-weight: 700; letter-spacing: 0.2px; border: 1px solid transparent; line-height: 1; height: 15px; white-space: nowrap; }
.pill.team-a { background: var(--team-a-bg); color: var(--team-a); border-color: var(--team-a-dim); }
.pill.team-b { background: var(--team-b-bg); color: var(--team-b); border-color: var(--team-b-dim); }
.pill.field-zone { background: rgba(251, 191, 36, 0.14); color: var(--accent); border-color: var(--accent-dim); }
.clear-zone {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-mute);
  padding: 0 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-transform: uppercase;
  height: 15px;
  margin-left: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
}
.clear-zone:hover { color: var(--text); border-color: var(--border-bright); }

/* Events grid */
.events-grid {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 14px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.event-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 4px;
  color: var(--text);
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 78px;
  position: relative;
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.event-btn:active { transform: scale(0.96); }
.event-btn:hover { border-color: var(--border-bright); background: var(--surface-2); }
.event-btn.picker-source {
  border-color: var(--accent);
  background: rgba(251, 191, 36, 0.18);
  z-index: 200;
  box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.4), 0 6px 18px rgba(0,0,0,0.4);
}
.event-btn.disabled {
  opacity: 0.38;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(0.5);
}
.event-btn.score {
  border-color: var(--accent-dim);
  background: linear-gradient(180deg, rgba(251, 191, 36, 0.10), var(--surface));
}
.event-btn.score:hover { border-color: var(--accent); }
.event-btn.danger {
  border-color: rgba(239, 68, 68, 0.3);
  background: linear-gradient(180deg, rgba(239, 68, 68, 0.08), var(--surface));
}
.event-btn.danger:hover { border-color: var(--danger); }
.event-btn.attack {
  border-color: rgba(34, 197, 94, 0.3);
  background: linear-gradient(180deg, rgba(34, 197, 94, 0.08), var(--surface));
}
.event-btn.attack:hover { border-color: var(--success); }
.event-btn.more-btn {
  border-style: dashed;
  color: var(--text-dim);
}
.event-btn.more-btn .event-icon { color: var(--text-dim); font-size: 18px; letter-spacing: 1px; }
.event-btn.more-btn .event-name { font-size: 9.5px; line-height: 1.1; }

/* Zone shortcuts row inside event button */
.event-btn { padding-top: 4px; }
.zone-shortcuts {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  width: 100%;
  margin-bottom: 4px;
  padding: 0 2px;
}
.zone-shortcut {
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  border-radius: 3px;
  background: transparent;
  color: rgba(255, 255, 255, 0.18);
  border: 1px solid transparent;
  transition: all 0.12s;
  position: relative;
  z-index: 3;
}
.zone-shortcut.zs-selected {
  background: var(--accent);
  color: #000;
  border-color: #fff;
  box-shadow: 0 0 4px rgba(251, 191, 36, 0.6);
  font-weight: 800;
}
.zone-shortcut:active {
  transform: scale(0.85);
  background: var(--accent);
  color: #000;
}
.event-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  pointer-events: none;
}
.event-content .event-icon { font-size: 14px; line-height: 1; }
.event-content .event-name { font-size: 11px; line-height: 1; }

/* Team picker overlay — fullscreen with two large drop targets */
.picker-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  pointer-events: none;
  animation: fadeIn 0.18s;
}
.picker-overlay.hidden { display: none; }
.picker-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 30px 14px;
  transition: background 0.15s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.picker-panel.a {
  background: linear-gradient(90deg, var(--team-a-bg), rgba(228, 61, 61, 0.05));
  border-right: 2px dashed rgba(228, 61, 61, 0.3);
}
.picker-panel.b {
  background: linear-gradient(-90deg, var(--team-b-bg), rgba(61, 141, 228, 0.05));
  border-left: 2px dashed rgba(61, 141, 228, 0.3);
}
.picker-panel.active.a {
  background: linear-gradient(90deg, var(--team-a), rgba(228, 61, 61, 0.4));
  transform: scale(1.02);
}
.picker-panel.active.b {
  background: linear-gradient(-90deg, var(--team-b), rgba(61, 141, 228, 0.4));
  transform: scale(1.02);
}
.picker-arrow {
  font-size: 48px;
  color: rgba(255,255,255,0.85);
  line-height: 1;
  font-weight: 800;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
.picker-panel.a .picker-arrow { color: var(--team-a); }
.picker-panel.b .picker-arrow { color: var(--team-b); }
.picker-panel.active .picker-arrow {
  color: #fff;
  transform: scale(1.3);
  transition: transform 0.15s;
}
.picker-team-name {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 1.5px;
  text-align: center;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  line-height: 1;
  word-break: break-word;
  max-width: 90%;
}
.picker-panel.a .picker-team-name { color: var(--team-a); }
.picker-panel.b .picker-team-name { color: var(--team-b); }
.picker-panel.active .picker-team-name { color: #fff; }
.picker-hint {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 600;
  opacity: 0.7;
}
.picker-panel.active .picker-hint {
  color: #fff;
  opacity: 1;
}
.picker-center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 14px;
  padding: 12px 18px;
  text-align: center;
  pointer-events: none;
  z-index: 5;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  min-width: 140px;
}
.picker-event-label {
  font-family: var(--display);
  font-size: 18px;
  letter-spacing: 1px;
  color: var(--accent);
  line-height: 1;
}
.picker-instruction {
  font-size: 9.5px;
  color: var(--text-mute);
  margin-top: 4px;
  letter-spacing: 0.4px;
  font-weight: 600;
}

/* Event order config modal */
.event-order-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 60vh;
  overflow-y: auto;
}
.sort-mode-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.sort-label {
  font-family: var(--display);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-mute);
  text-transform: uppercase;
}
.sort-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
}
.sort-btn:hover { color: var(--text); border-color: var(--border-bright); }
.sort-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.order-item {
  display: grid;
  grid-template-columns: auto auto 1fr auto auto auto auto;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
}
.order-item.order-hidden { opacity: 0.5; }
.order-handle {
  background: transparent;
  border: none;
